[platformio]
default_envs = living_room

[env]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    mahfuz195/BMP280@^1.0.0
    h2zero/NimBLE-Arduino@2.5.1
upload_port = /dev/ttyACM0
build_src_filter =
    +<*>
    -<ble_phase1.cpp>

[env:living_room]
build_flags = -D DEVICE_LOCATION_OVERRIDE=0

[env:kitchen]
build_flags = -D DEVICE_LOCATION_OVERRIDE=1

[env:ble_phase1_kitchen]
build_flags =
    -D DEVICE_LOCATION_OVERRIDE=1
    -D BLE_PHASE1_DIAGNOSTIC=1
    -D BLE_PHASE1_OTA_DIAGNOSTIC=1
build_src_filter =
    -<*>
    +<ble_phase1.cpp>
    +<ota_update.cpp>
